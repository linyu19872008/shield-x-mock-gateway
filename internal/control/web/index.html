<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mock-gateway Console</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">mg</span>
        <div class="brand-text">
          <strong>mock-gateway</strong>
          <span data-i18n="app.brandTagline">shield-x mock gateway</span>
        </div>
      </div>

      <nav id="nav" class="nav" aria-label="Main navigation" data-i18n-aria-label="nav.label">
        <div class="nav-group" data-i18n="nav.monitor">Monitor</div>
        <button class="nav-item" data-page="overview" data-i18n="nav.overview">Overview</button>

        <div class="nav-group" data-i18n="nav.access">Access</div>
        <button class="nav-item" data-page="connection" data-i18n="nav.connection">Connection &amp; capabilities</button>
        <button class="nav-item" data-page="policies" data-i18n="nav.policies">Policies &amp; templates</button>

        <div class="nav-group" data-i18n="nav.control">Control</div>
        <button class="nav-item" data-page="traffic" data-i18n="nav.traffic">Traffic generator</button>
        <button class="nav-item" data-page="fault" data-i18n="nav.fault">Fault injection</button>

        <div class="nav-group" data-i18n="nav.data">Data</div>
        <button class="nav-item" data-page="spool" data-i18n="nav.spool">Reporting &amp; spool</button>
        <button class="nav-item" data-page="logs" data-i18n="nav.logs">Logs &amp; configuration</button>
      </nav>

      <div class="sidebar-foot">
        <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria-label="lang.label">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="zh" aria-pressed="false">中文</button>
        </div>
        <button id="theme-btn" class="ghost-btn" type="button">Theme: Auto</button>
        <span class="contract">contract agent-v1</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title" data-i18n="page.overview.title">Overview</h1>
          <p id="page-sub" data-i18n="page.overview.subtitle">Runtime status and throughput</p>
        </div>
        <div class="topbar-actions">
          <span id="run-pill" class="pill"><span class="dot"></span><span data-i18n="status.connecting">Connecting…</span></span>
          <button id="stop-btn" class="btn btn-ghost" type="button" disabled data-i18n="common.stop">Stop</button>
        </div>
      </header>

      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <h2 data-i18n="auth.title">Console token required</h2>
      <p data-i18n="auth.description">This serve process uses --ui-token. Enter the token; it is stored locally and sent only in the request header.</p>
      <label><span data-i18n="auth.token">Token</span>
        <input id="auth-token" type="password" autocomplete="off" placeholder="ui token">
      </label>
      <button class="btn btn-primary" type="submit" data-i18n="auth.enter">Enter console</button>
    </form>
  </div>

  <script src="/locales/en.js"></script>
  <script src="/locales/zh-CN.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
