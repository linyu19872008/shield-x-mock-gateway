name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real tenant tokens, cookies, or production data.
  - type: input
    id: version
    attributes:
      label: mock-gateway version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "mock-gateway gateway --config config.yaml"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted configuration and logs
      description: Remove tokens, hostnames, cookies, and production data.
      render: yaml
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Go version, install method"
